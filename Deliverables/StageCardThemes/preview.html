<style>
*{box-sizing:border-box}body{margin:0;background:#f2ecde;color:#32281f;font-family:"Yu Gothic UI","Meiryo",sans-serif}main{max-width:1600px;margin:auto;padding:32px}h1{margin:0 0 10px;font-size:27px}p{margin:0 0 24px;color:#6d5a48;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:#fffaf0;border:1px solid #cbbb9d;border-radius:10px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:0 4px 12px #39271015}.card img{width:100%;height:auto;display:block}.card span{display:block;padding:12px 16px;font-weight:700}.card:hover{outline:3px solid #b78c42}.links{display:flex;gap:20px;margin:24px 0}.links a{color:#76511b}dialog{border:0;border-radius:10px;background:#fffaf0;padding:12px;max-width:95vw;max-height:95vh}dialog::backdrop{background:#21180ed9}dialog img{display:block;max-width:90vw;max-height:80vh;object-fit:contain}dialog button{display:block;margin:10px 0 0 auto;border:1px solid #9b815f;background:#fffaf0;padding:8px 16px;border-radius:6px;cursor:pointer}#caption{font-weight:bold;margin:10px 5px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:20px}}@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:23px}}
</style>
<main><h1>ステージカード背景 · 9テーマ</h1><p>元の魔法店の絵柄を基準に、仕分けテーマごとの背景を制作。画像を選ぶと拡大できます。</p><div class="grid">

<dialog><img id="large" alt=""><div id="caption"></div><button type="button">閉じる</button></dialog>
<style>#viewmode{margin:0 0 22px;padding:10px 18px;background:#76511b;color:#fffaf0;border:0;border-radius:6px;cursor:pointer;font:inherit}.screen .card img{aspect-ratio:9/16;object-fit:contain}</style>
<script>
const dialog=document.querySelector('dialog');
const viewmode=document.createElement('button');viewmode.id='viewmode';viewmode.textContent='カードに入った状態を見る';document.querySelector('.grid').before(viewmode);
const stages=['01','04','08','11','16','17','18','19','20'];
document.querySelectorAll('.card').forEach((card,i)=>{card.dataset.art=card.getAttribute('href');card.dataset.screen='Preview/Stage'+stages[i]+'_Android_1080x1920.png'});
viewmode.onclick=()=>{const screen=document.body.classList.toggle('screen');viewmode.textContent=screen?'背景だけを見る':'カードに入った状態を見る';document.querySelectorAll('.card').forEach(card=>{const path=screen?card.dataset.screen:card.dataset.art;card.href=path;card.querySelector('img').src=path})};
document.querySelectorAll('.card').forEach(card=>card.addEventListener('click',e=>{e.preventDefault();document.querySelector('#large').src=card.href;document.querySelector('#large').alt=card.querySelector('img').alt;document.querySelector('#caption').textContent=card.textContent;dialog.showModal()}));
dialog.querySelector('button').onclick=()=>dialog.close();
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
</script></html>
